# Execute com: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
spring.datasource.url=${GYMWEB_DB_URL:jdbc:mysql://localhost:3306/gymweb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${GYMWEB_DB_USERNAME:root}
spring.datasource.password=${GYMWEB_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
