<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <main class="login-page">
        <!-- Lado Esquerdo — Hero / Banner da Academia -->
        <section class="login-hero" aria-hidden="true">
            <div class="hero-content">
                <span class="hero-badge">GYMWEB SYSTEM</span>
                <h2 class="hero-title">TRANSFORME SEU<br>TREINO E GESTÃO</h2>
                <p class="hero-description">A plataforma completa para gestão de treinos, instrutores e alunos.</p>
            </div>
        </section>

        <!-- Lado Direito — Formulário de Login -->
        <section class="login-form-section">
            <div class="login-card">
                <span class="badge-pill">ACESSO AO SISTEMA</span>
                <h1 id="titulo-login" class="brand-title">GYMWEB</h1>
                <p class="subtitle">Entre com suas credenciais para acessar o painel</p>

                <div id="mensagem" class="notice hidden" role="alert"></div>

                <form id="form-login" novalidate>
                    <div class="form-group">
                        <label for="cpf">CPF</label>
                        <input id="cpf" name="cpf" inputmode="numeric" autocomplete="username" maxlength="14" placeholder="000.000.000-00" required>
                    </div>
                    <div class="form-group" style="margin-top: .9rem;">
                        <label for="senha">Senha</label>
                        <div style="display:flex; align-items:center; gap:.5rem;">
                            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
                            <button type="button" id="toggleSenha" class="btn btn-secondary" style="padding:.3rem .6rem;">👁️</button>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button id="btn-entrar" class="btn btn-primary" type="submit">Entrar</button>
                    </div>
                </form>

                <aside class="credentials">
                    <strong>Acesso de demonstração</strong><br>
                    Administrador: CPF <code>00000000000</code> · senha <code>admin123</code><br>
                </aside>
            </div>
        </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>

    <script>
        const senhaInput = document.getElementById("senha");
        const toggleBtn = document.getElementById("toggleSenha");

        toggleBtn.addEventListener("click", () => {
            const isPassword = senhaInput.type === "password";
            senhaInput.type = isPassword ? "text" : "password";
            toggleBtn.textContent = isPassword ? "🙈" : "👁️";
        });
    </script>
</body>
</html>
