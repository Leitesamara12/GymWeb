<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Montar treino | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/dashboard.html">GYM<span>WEB</span></a>
            <nav aria-label="Navegação principal">
                <a href="/dashboard.html">Painel</a>
                <a href="/cadastro_aluno.html">Alunos</a>
                <a href="/catalogo.html">Exercícios</a>
                <a href="/montar_treino.html">Treinos</a>
                <a data-apenas-dono href="/cadastro_instrutor.html">Instrutores</a>
                <button class="btn-link" data-logout>Sair</button>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div>
                    <h1>Montar treino</h1>
                    <p data-usuario-nome>Monte uma série personalizada para um aluno.</p>
                </div>
                <a class="btn btn-secondary" href="/catalogo.html">Gerenciar exercícios</a>
            </section>

            <div id="mensagem" class="notice hidden" role="alert"></div>

            <section class="card">
                <div class="card-body">
                    <form id="form-treino" novalidate>
                        <div class="form-grid">
                            <div class="form-group"><label for="nome">Nome do treino</label><input id="nome" maxlength="100" required placeholder="Ex.: Treino A — Peitoral"></div>
                            <div class="form-group"><label for="alunoId">Aluno</label><select id="alunoId" required><option value="">Selecione</option></select></div>
                            <div class="form-group"><label for="instrutorId">Instrutor responsável</label><select id="instrutorId" required><option value="">Selecione</option></select></div>
                            <div class="form-group full"><label for="descricao">Descrição</label><textarea id="descricao" maxlength="500" placeholder="Objetivo ou observações do treino."></textarea></div>
                        </div>

                        <div class="page-header" style="margin:1.6rem 0 .65rem; align-items:center;">
                            <div><h2 style="margin:0; font-size:1.15rem; font-weight:700;">Exercícios</h2><p>Inclua ao menos um item.</p></div>
                            <button id="btn-adicionar-exercicio" class="btn btn-outline" type="button">Adicionar exercício</button>
                        </div>
                        <div id="linhas-exercicios"></div>

                        <div class="form-actions">
                            <a class="btn btn-secondary" href="/dashboard.html">Cancelar</a>
                            <button id="btn-salvar" class="btn btn-primary" type="submit">Salvar treino</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <template id="template-exercicio">
        <div class="exercise-row">
            <div class="form-group exercise-name"><label>Exercício</label><select class="campo-exercicio" required></select></div>
            <div class="form-group"><label>Séries</label><input class="campo-series" type="number" min="1" value="3" required></div>
            <div class="form-group"><label>Repetições</label><input class="campo-repeticoes" type="number" min="1" value="10" required></div>
            <div class="form-group"><label>Carga (kg)</label><input class="campo-carga" type="number" min="0" step="0.5" value="0" required></div>
            <button class="btn btn-danger btn-remover-exercicio" type="button">Remover</button>
        </div>
    </template>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/treino.js"></script>
</body>
</html>
