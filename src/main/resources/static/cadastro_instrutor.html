<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instrutores | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/dashboard.html">GYM<span>WEB</span></a>
            <nav aria-label="Navegação principal">
                <a href="/dashboard.html">Painel</a>
                <a href="/cadastro_aluno.html">Alunos</a>
                <a href="/catalogo.html">Exercícios</a>
                <a href="/montar_treino.html">Treinos</a>
                <a href="/cadastro_instrutor.html">Instrutores</a>
                <button class="btn-link" data-logout>Sair</button>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div>
                    <h1>Instrutores</h1>
                    <p data-usuario-nome>Cadastro restrito ao administrador.</p>
                </div>
            </section>

            <div id="mensagem" class="notice hidden" role="alert"></div>

            <section class="card form-card">
                <div class="card-body">
                    <h2 style="margin-top: 0; font-size:1.05rem; font-weight:700;">Cadastrar instrutor</h2>
                    <form id="form-instrutor" class="form-grid" novalidate>
                        <div class="form-group"><label for="nome">Nome completo</label><input id="nome" required maxlength="100"></div>
                        <div class="form-group"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" required maxlength="14" placeholder="000.000.000-00"></div>
                        <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" required maxlength="100" placeholder="nome@gmail.com"></div>
                        <div class="form-group"><label for="telefone">Telefone</label><input id="telefone" inputmode="tel" maxlength="20" placeholder="(00) 00000-0000"></div>
                        <div class="form-group"><label for="especialidade">Especialidade</label><input id="especialidade" maxlength="50" placeholder="Ex.: Musculação"></div>
                        <div class="form-group"><label for="senha">Senha inicial</label><input id="senha" type="password" required minlength="6"></div>
                        <div class="form-actions full">
                            <button class="btn btn-secondary" type="reset">Limpar</button>
                            <button id="btn-salvar" class="btn btn-primary" type="submit">Salvar instrutor</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" style="margin-top: 1.2rem;">
                <div class="card-body">
                    <h2 style="margin-top: 0; font-size:1.05rem; font-weight:700;">Instrutores cadastrados</h2>
                    <div id="lista-instrutores" class="table-wrapper"><p class="status">Carregando...</p></div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/instrutor.js"></script>
</body>
</html>
