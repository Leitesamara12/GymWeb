<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instrutores | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/dashboard.html"><i class="fa-solid fa-dumbbell"></i> GYM<span>WEB</span></a>
            <nav aria-label="Navegação principal">
                <a href="/dashboard.html"><i class="fa-solid fa-chart-line"></i> Painel</a>
                <a href="/cadastro_aluno.html"><i class="fa-solid fa-user-plus"></i> Alunos</a>
                <a href="/catalogo.html"><i class="fa-solid fa-list"></i> Exercícios</a>
                <a href="/montar_treino.html"><i class="fa-solid fa-dumbbell"></i> Treinos</a>
                <a href="/cadastro_instrutor.html"><i class="fa-solid fa-person-chalkboard"></i> Instrutores</a>
                <button class="btn-link" data-logout><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div>
                    <h1><i class="fa-solid fa-person-chalkboard"></i> Instrutores</h1>
                    <p data-usuario-nome>Cadastro restrito ao administrador.</p>
                </div>
            </section>

            <div id="mensagem" class="notice hidden" role="alert"></div>

            <section class="card form-card">
                <div class="card-body">
                    <h2 style="margin-top: 0; font-size:1.05rem; font-weight:700;" id="titulo-formulario">
                        <i class="fa-solid fa-user-plus" style="color:var(--neon-green);margin-right:6px;"></i>Cadastrar instrutor
                    </h2>
                    <form id="form-instrutor" class="form-grid" novalidate>
                        <input type="hidden" id="instrutor-id">
                        <div class="form-group"><label for="nome">Nome completo</label><input id="nome" required maxlength="100"></div>
                        <div class="form-group"><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" required maxlength="14" placeholder="000.000.000-00"></div>
                        <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" required maxlength="100"></div>
                        <div class="form-group"><label for="telefone">Telefone</label><input id="telefone" inputmode="tel" maxlength="20" placeholder="(00) 00000-0000"></div>
                        <div class="form-group"><label for="especialidade">Especialidade</label><input id="especialidade" maxlength="50" placeholder="Ex.: Musculação"></div>
                        <div class="form-group"><label for="senha">Senha inicial</label><input id="senha" type="password" required minlength="6" placeholder="Mínimo 6 caracteres"></div>
                        <div class="form-actions full">
                            <button class="btn btn-secondary" type="reset" id="btn-limpar">Limpar</button>
                            <button id="btn-salvar" class="btn btn-primary" type="submit"><i class="fa-solid fa-check"></i> Salvar instrutor</button>
                        </div>
                    </form>
                </div>
            </section>

            <section class="card" style="margin-top: 1.2rem;">
                <div class="card-body">
                    <h2 style="margin-top: 0; font-size:1.05rem; font-weight:700;">
                        <i class="fa-solid fa-list" style="color:var(--neon-green);margin-right:6px;"></i>Instrutores cadastrados
                    </h2>
                    <div id="lista-instrutores" class="table-wrapper"><p class="status"><i class="fa-solid fa-spinner fa-spin"></i> Carregando...</p></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Confirmação de Exclusão -->
    <div id="modal-excluir" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Confirmar exclusão</h3>
                <button class="modal-close" id="modal-fechar">&times;</button>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja excluir este instrutor? Esta ação não pode ser desfeita.</p>
                <p id="modal-nome-instrutor" style="font-weight:700; color:var(--neon-green); margin-top:0.5rem;"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modal-cancelar">Cancelar</button>
                <button class="btn btn-danger" id="modal-confirmar"><i class="fa-solid fa-trash"></i> Excluir</button>
            </div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/instrutor.js"></script>
</body>
</html>
