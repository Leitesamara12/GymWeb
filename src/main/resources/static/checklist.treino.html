<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meus treinos | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000000;
            color: #ffffff;
            min-height: 100vh;
        }

        .app-shell {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 0.75rem 1.5rem;
            border-radius: 1.2rem;
            border: 1px solid #333;
            margin-bottom: 1.5rem;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 900;
            text-decoration: none;
            color: #ffffff;
        }
        .brand span {
            color: #c0f135;
        }

        .topbar nav {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.2rem;
        }

        .topbar nav a {
            text-decoration: none;
            font-weight: 500;
            color: #ffffff;
            font-size: 0.95rem;
            transition: color 0.2s;
        }
        .topbar nav a:hover {
            color: #c0f135;
        }

        .btn-link {
            background: none;
            border: none;
            font-weight: 500;
            color: #ffffff;
            cursor: pointer;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
        }
        .btn-link:hover {
            color: #c0f135;
        }

        .page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }
        .page-header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: #ffffff;
        }
        .page-header p {
            color: #aaaaaa;
            font-weight: 500;
        }

        .card {
            background: #1a1a1a;
            border-radius: 1.4rem;
            border: 1px solid #333;
            padding: 1.2rem 1.5rem 1.8rem;
            transition: border-color 0.2s;
        }
        .card:hover {
            border-color: #555;
        }

        .card-body h2 {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        /* --- CHECKLIST --- */
        .checklist {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin: 0.75rem 0 0.25rem;
        }

        .check-item {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            background: #0a0a0a;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid #2a2a2a;
            gap: 0.5rem 1rem;
        }
        .check-item:hover {
            background: #151515;
            border-color: #444;
        }

        .check-item .info {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.8rem 1.2rem;
            flex: 1 1 180px;
        }

        .check-item .info strong {
            font-weight: 600;
            font-size: 1rem;
            color: #ffffff;
            min-width: 120px;
        }

        .check-item .info .series {
            font-size: 0.9rem;
            color: #aaaaaa;
            background: #1a1a1a;
            padding: 0.15rem 0.75rem;
            border-radius: 1.2rem;
            font-weight: 500;
            border: 1px solid #333;
        }

        /* checkbox custom */
        .check-wrapper {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .check-wrapper input[type="checkbox"] {
            width: 1.25rem;
            height: 1.25rem;
            accent-color: #c0f135;
            cursor: pointer;
            flex-shrink: 0;
        }

        .status-badge {
            display: inline-block;
            padding: 0.2rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.02em;
            transition: 0.15s;
            white-space: nowrap;
        }

        .status-badge.concluido {
            background: #c0f135;
            color: #000000;
            border: 1px solid #c0f135;
        }

        .status-badge.pendente {
            background: #333333;
            color: #ffffff;
            border: 1px solid #555;
        }

        /* gráfico */
        #grafico-treino {
            max-width: 100%;
            height: auto;
            max-height: 180px;
            width: 100% !important;
        }

        /* responsivo */
        @media (max-width: 640px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.7rem;
                padding: 1rem;
            }
            .topbar nav {
                justify-content: space-between;
            }
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.3rem;
            }
            .page-header h1 {
                font-size: 1.5rem;
            }
            .card {
                padding: 1rem;
            }
            .check-item {
                flex-direction: column;
                align-items: stretch;
            }
            .check-item .info {
                flex: 1 1 auto;
                gap: 0.4rem;
            }
            .check-item .info strong {
                min-width: unset;
                font-size: 0.95rem;
            }
            .check-wrapper {
                justify-content: space-between;
                margin-top: 0.2rem;
            }
            .status-badge {
                font-size: 0.7rem;
                padding: 0.15rem 0.7rem;
            }
        }

        @media (max-width: 400px) {
            .check-item .info {
                flex-direction: column;
                align-items: flex-start;
            }
            .check-wrapper {
                width: 100%;
            }
        }

        .notice {
            padding: 0.75rem 1rem;
            border-radius: 0.8rem;
            margin-bottom: 0.8rem;
            font-weight: 500;
            background: #1a3a1a;
            color: #c0f135;
            border-left: 4px solid #c0f135;
        }
        .notice.hidden {
            display: none;
        }

        .mt-2 {
            margin-top: 1.2rem;
        }

        /* Estilos para o contador */
        .counter-badge {
            font-size: 0.75rem;
            font-weight: 500;
            color: #000000;
            background: #c0f135;
            padding: 0.1rem 0.9rem;
            border-radius: 2rem;
        }

        .progress-text {
            color: #aaaaaa;
            border-top: 1px dashed #333;
            padding-top: 0.8rem;
        }

        .progress-text span:last-child {
            color: #c0f135;
            font-weight: 600;
        }

        /* Chart.js ajustes para fundo escuro */
        .card canvas {
            filter: brightness(0.9);
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">GYM<span>WEB</span></a>
            <nav aria-label="Navegação principal">
                <a href="/checklist.treino.html">Meus treinos</a>
                <button class="btn-link" data-logout>Sair</button>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div>
                    <h1>Meus treinos</h1>
                    <p data-usuario-nome>Checklist interativo</p>
                </div>
            </section>

            <div id="mensagem" class="notice hidden" role="alert"></div>

            <!-- CHECKLIST (caixinha) -->
            <section class="card" style="margin-top:0.2rem;">
                <div class="card-body">
                    <h2 style="margin-top:0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;">
                        <span>Checklist de exercícios</span>
                        <span class="counter-badge">
                            <span id="concluidos-count">0</span> / <span id="total-count">0</span> concluídos
                        </span>
                    </h2>

                    <div class="checklist" id="checklist-container">
                        <!-- os itens serão inseridos via JS -->
                    </div>

                    <!-- pequeno resumo -->
                    <div class="progress-text" style="margin-top: 0.8rem; font-size:0.85rem; display: flex; justify-content: space-between; flex-wrap: wrap;">
                        <span>Marque o checkbox para concluir</span>
                        <span id="progresso-texto">0% completo</span>
                    </div>
                </div>
            </section>

            <!-- Gráfico abaixo -->
            <section class="card" style="margin-top:1.2rem;">
                <div class="card-body">
                    <h2 style="margin-top:0; font-size:1.05rem; font-weight:700; color:#ffffff;">Progresso semanal</h2>
                    <canvas id="grafico-treino" height="150"></canvas>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        (function() {
            // ----- DADOS DOS EXERCÍCIOS (checklist) -----
            const exercicios = [
                { nome: 'Supino reto', series: '3x12', concluido: false },
                { nome: 'Agachamento', series: '4x10', concluido: false },
                { nome: 'Rosca bíceps', series: '3x15', concluido: false },
                { nome: 'Puxada frontal', series: '4x12', concluido: false },
                { nome: 'Leg press', series: '3x15', concluido: false },
                { nome: 'Tríceps corda', series: '3x12', concluido: false }
            ];

            const container = document.getElementById('checklist-container');
            const concluidosSpan = document.getElementById('concluidos-count');
            const totalSpan = document.getElementById('total-count');
            const progressoTexto = document.getElementById('progresso-texto');

            // ----- RENDERIZA A CHECKLIST -----
            function renderChecklist() {
                container.innerHTML = '';
                let concluidos = 0;

                exercicios.forEach((item, index) => {
                    if (item.concluido) concluidos++;

                    const div = document.createElement('div');
                    div.className = 'check-item';

                    // parte esquerda: nome + série
                    const infoDiv = document.createElement('div');
                    infoDiv.className = 'info';
                    infoDiv.innerHTML = `
                        <strong>${item.nome}</strong>
                        <span class="series">${item.series}</span>
                    `;

                    // parte direita: checkbox + status
                    const wrapper = document.createElement('div');
                    wrapper.className = 'check-wrapper';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = item.concluido;
                    checkbox.setAttribute('aria-label', `Marcar ${item.nome} como concluído`);

                    const badge = document.createElement('span');
                    badge.className = 'status-badge';
                    badge.textContent = item.concluido ? 'Concluído' : 'Pendente';
                    badge.classList.add(item.concluido ? 'concluido' : 'pendente');

                    // evento do checkbox
                    checkbox.addEventListener('change', function(e) {
                        item.concluido = this.checked;
                        // atualiza badge
                        if (item.concluido) {
                            badge.textContent = 'Concluído';
                            badge.className = 'status-badge concluido';
                        } else {
                            badge.textContent = 'Pendente';
                            badge.className = 'status-badge pendente';
                        }
                        // recalcula totais
                        atualizarContadores();
                    });

                    wrapper.appendChild(checkbox);
                    wrapper.appendChild(badge);
                    div.appendChild(infoDiv);
                    div.appendChild(wrapper);
                    container.appendChild(div);
                });

                // atualiza contadores
                totalSpan.textContent = exercicios.length;
                atualizarContadores();
            }

            // ----- ATUALIZA CONTADORES E PROGRESSO -----
            function atualizarContadores() {
                const total = exercicios.length;
                const concluidos = exercicios.filter(e => e.concluido).length;
                concluidosSpan.textContent = concluidos;
                totalSpan.textContent = total;
                const pct = total === 0 ? 0 : Math.round((concluidos / total) * 100);
                progressoTexto.textContent = `${pct}% completo`;

                // se todos concluídos, mostra mensagem
                const mensagem = document.getElementById('mensagem');
                if (concluidos === total && total > 0) {
                    mensagem.textContent = '🎉 Parabéns! Todos os exercícios foram concluídos!';
                    mensagem.className = 'notice';
                } else {
                    mensagem.className = 'notice hidden';
                }
            }

            // ----- INICIALIZA -----
            renderChecklist();

            // ----- GRÁFICO (configurado para fundo escuro) -----
            const ctx = document.getElementById('grafico-treino').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'],
                    datasets: [{
                        label: 'Exercícios concluídos',
                        data: [3, 4, 2, 5, 4, 1],
                        backgroundColor: '#c0f135',
                        borderColor: '#c0f135',
                        borderWidth: 1,
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { 
                            labels: { 
                                color: '#ffffff' 
                            } 
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { 
                                stepSize: 1,
                                color: '#aaaaaa'
                            },
                            grid: {
                                color: '#333333'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#aaaaaa'
                            },
                            grid: {
                                color: '#333333'
                            }
                        }
                    }
                }
            });

            // ----- SIMULA LOGOUT (só para teste) -----
            document.querySelector('[data-logout]')?.addEventListener('click', function(e) {
                e.preventDefault();
                alert('Simulação: você saiu do sistema.');
            });

        })();
    </script>
</body>
</html>
