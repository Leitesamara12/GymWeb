<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meu treino | GymWeb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="/">GYM<span>WEB</span></a>
            <nav aria-label="Navegação principal">
                <a href="/checklist.treino.html">Meu treino</a>
                <button class="btn-link" data-logout>Sair</button>
            </nav>
        </header>

        <main class="page">
            <section class="page-header">
                <div>
                    <h1>Meu treino</h1>
                    <p data-usuario-nome>Carregando seus exercícios...</p>
                </div>
            </section>

            <div id="mensagem" class="notice hidden" role="alert"></div>
            <section class="card">
                <div class="card-body">
                    <div id="treino-detalhe"><p class="status">Carregando treino...</p></div>
                    <div id="lista-checklist" class="checklist"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/checklist.treino.js"></script>
</body>
</html>
